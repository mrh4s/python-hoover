[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "python-hoover"
version = "1.0.0"
description = "WiFi Security Toolkit - Probe request monitoring, SSID generation, and security testing tools"
license = "MIT"
requires-python = ">=3.9"
readme = "README.md"
keywords = ["wifi", "security", "penetration-testing", "wireless", "probe-request"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "scapy>=2.5.0",
    "flask>=2.3.0",
    "flask-socketio>=5.3.0",
    "python-socketio>=5.9.0",
    "eventlet>=0.33.0",
    "psutil>=5.9.0",
    "bleak>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[project.scripts]
hoover = "hoover:main"
ssid-generator = "ssid_generator:main"
ssid-capturer = "ssid_capturer:main"
deauth = "deauth:main"
hoover-web = "hoover_web:main"
ap-scanner = "ap_scanner:main"
handshake-capture = "handshake_capture:main"
captive-portal = "captive_portal:main"
karma-attack = "karma_attack:main"
wids = "wids:main"
packet-replay = "packet_replay:main"
wps-attack = "wps_attack:main"
network-mapper = "network_mapper:main"
ble-scanner = "ble_scanner:main"
pentest-workflow = "pentest_workflow:main"
eap-attack = "eap_attack:main"

[tool.setuptools]
py-modules = [
    "hoover",
    "ssid_generator",
    "ssid_capturer",
    "deauth",
    "hoover_web",
    "utils",
    "oui_lookup",
    "ap_scanner",
    "handshake_capture",
    "captive_portal",
    "karma_attack",
    "wids",
    "packet_replay",
    "wps_attack",
    "network_mapper",
    "ble_scanner",
    "pentest_workflow",
    "eap_attack",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
